<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cdaa76" />
    <meta name="description" content="Lumé Parfums : parfums originaux, livraison gratuite partout au Maroc, paiement à la réception." />
    <title>Lumé Parfums</title>

    <!-- The preview WhatsApp, LinkedIn and others show when the link is shared. Their image needs
         a full address: __SITE_URL__ is replaced at build time with VITE_SITE_URL (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumé Parfums" />
    <meta property="og:title" content="Lumé Parfums" />
    <meta property="og:description" content="Parfums originaux, livraison gratuite partout au Maroc, paiement à la réception." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_MA" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
